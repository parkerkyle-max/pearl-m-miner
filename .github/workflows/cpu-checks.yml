name: CPU correctness and lifecycle checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.5.4 blake3==1.0.11
      - run: python -m compileall -q pearl_m_miner pearl_metal_miner tools tests
      - name: Verify pinned comparison source and exact compatibility patch
        run: |
          python packaging/build_compare_control.py --verify-only
          python packaging/build_compare_control.py --prepare-only
      - name: Check published benchmark documentation
        run: |
          python tools/build_device_matrix.py --check
          python tools/check_site.py
      - run: python -m unittest discover -s tests -v
      - name: Explain CI scope
        run: echo 'CPU mocks and lifecycle only. Native Metal, official proof and pool acceptance require an Apple Silicon device and separate evidence.'
